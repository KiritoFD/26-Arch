source [find interface/ftdi/digilent_jtag.cfg]

set _CHIPNAME xc7a35t
set _JTAG_TAP $_CHIPNAME.tap

jtag newtap $_CHIPNAME tap -irlen 6 -expected-id 0x0362d093

set _FLASHNAME $_CHIPNAME.flash
flash bank $_FLASHNAME spi_nor 0x00000000 0 0 0 $_JTAG_TAP 0x00000000

adapter speed 2000

init
ftdi_set_signal nTRST 0
ftdi_set_signal nSRST 0

puts "Basys3 SPI Flash configuration loaded"
source [find interface/ftdi/digilent_jtag_smt2.cfg]

set _CHIPNAME xc7a35t
set _JTAG_TAP $_CHIPNAME.tap

jtag newtap $_CHIPNAME tap -irlen 6 -expected-id 0x0362d093

adapter speed 2000

init

puts "Programming SPI Flash..."

flash write_bank 0 /mnt/g/GitHub/26-Arch/vivado/test-cpu/project/project_3/full_flash.bin 0x0

puts "SPI Flash programming complete!"

shutdown